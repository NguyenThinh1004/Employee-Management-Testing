<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2550" viewBox="0 0 1600 2550">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: Arial, "Segoe UI", sans-serif; fill: #172033; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #475569; }
      .card { fill: #fff; stroke: #cbd5e1; stroke-width: 2; rx: 16; }
      .head { font-size: 22px; font-weight: 700; }
      .expr { font-size: 15px; fill: #475569; }
      .node { fill: #e9d5ff; stroke: #7e22ce; stroke-width: 2; }
      .nodeText { font-size: 15px; font-weight: 700; text-anchor: middle; }
      .edge { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .branch { font-size: 14px; font-weight: 700; fill: #7c2d12; }
      .out { font-size: 14px; font-weight: 600; fill: #1d4ed8; }
      .note { font-size: 15px; fill: #475569; }
    </style>
  </defs>
  <rect width="1600" height="2550" fill="#f1f5f9"/>
  <text x="60" y="58" class="title">C3 - TACH CAC DIEM QUYET DINH PHUC HOP</text>
  <text x="60" y="92" class="subtitle">Moi dieu kien con la mot nut rieng; T/F the hien luong short-circuit cua bieu thuc.</text>
  <text x="60" y="119" class="subtitle">So nut doi chieu theo router.md (R) va validation.md (V).</text>

  <!-- Router request-body condition -->
  <g transform="translate(40 145)">
    <rect class="card" width="750" height="300"/>
    <text x="24" y="38" class="head">Router - diem 2</text>
    <text x="24" y="65" class="expr">!unit || typeof unit !== 'object' || Array.isArray(unit)</text>
    <circle class="node" cx="110" cy="145" r="32"/><text class="nodeText" x="110" y="150">2.1</text>
    <circle class="node" cx="330" cy="145" r="32"/><text class="nodeText" x="330" y="150">2.2</text>
    <circle class="node" cx="550" cy="145" r="32"/><text class="nodeText" x="550" y="150">2.3</text>
    <path class="edge" d="M142 145 H675 V215"/>
    <text class="branch" x="155" y="133">T</text>
    <path class="edge" d="M362 145 H675 V215"/>
    <text class="branch" x="375" y="133">T</text>
    <path class="edge" d="M582 145 H675 V215"/>
    <text class="branch" x="595" y="133">T</text>
    <path class="edge" d="M142 145 H330"/>
    <text class="branch" x="230" y="133">F</text>
    <path class="edge" d="M362 145 H550"/>
    <text class="branch" x="430" y="133">F</text>
    <path class="edge" d="M550 177 V253 H690"/>
    <text class="branch" x="560" y="247">F</text>
    <text class="out" x="685" y="234">3: tra 400</text>
    <text class="out" x="520" y="282">4: goi validation</text>
  </g>

  <!-- OR compound condition cards -->
  <g transform="translate(810 145)">
    <rect class="card" width="750" height="300"/>
    <text x="24" y="38" class="head">V18 - ten don vi</text>
    <text x="24" y="65" class="expr">typeof unitName !== 'string' || unitName.trim() === ''</text>
    <circle class="node" cx="150" cy="150" r="32"/><text class="nodeText" x="150" y="155">18.1</text>
    <circle class="node" cx="400" cy="150" r="32"/><text class="nodeText" x="400" y="155">18.2</text>
    <path class="edge" d="M182 150 H660 V220"/>
    <text class="branch" x="195" y="138">T</text>
    <path class="edge" d="M432 150 H660 V220"/>
    <text class="branch" x="445" y="138">T</text>
    <path class="edge" d="M182 150 H400"/>
    <text class="branch" x="285" y="138">F</text>
    <path class="edge" d="M400 182 V250 H690"/>
    <text class="branch" x="410" y="239">F</text>
    <text class="out" x="635" y="239">Push 19</text>
    <text class="out" x="520" y="278">False -> 20</text>
  </g>

  <g transform="translate(40 465)">
    <rect class="card" width="750" height="300"/>
    <text x="24" y="38" class="head">V24 - ma don vi</text>
    <text x="24" y="65" class="expr">typeof unitCode !== 'string' || unitCode.trim() === ''</text>
    <circle class="node" cx="150" cy="150" r="32"/><text class="nodeText" x="150" y="155">24.1</text>
    <circle class="node" cx="400" cy="150" r="32"/><text class="nodeText" x="400" y="155">24.2</text>
    <path class="edge" d="M182 150 H660 V220"/><text class="branch" x="195" y="138">T</text>
    <path class="edge" d="M432 150 H660 V220"/><text class="branch" x="445" y="138">T</text>
    <path class="edge" d="M182 150 H400"/><text class="branch" x="285" y="138">F</text>
    <path class="edge" d="M400 182 V250 H690"/><text class="branch" x="410" y="239">F</text>
    <text class="out" x="635" y="239">Push 25</text><text class="out" x="520" y="278">False -> 26</text>
  </g>

  <g transform="translate(810 465)">
    <rect class="card" width="750" height="300"/>
    <text x="24" y="38" class="head">V30 - loai don vi</text>
    <text x="24" y="65" class="expr">typeof unitType !== 'string' || unitType.trim() === ''</text>
    <circle class="node" cx="150" cy="150" r="32"/><text class="nodeText" x="150" y="155">30.1</text>
    <circle class="node" cx="400" cy="150" r="32"/><text class="nodeText" x="400" y="155">30.2</text>
    <path class="edge" d="M182 150 H660 V220"/><text class="branch" x="195" y="138">T</text>
    <path class="edge" d="M432 150 H660 V220"/><text class="branch" x="445" y="138">T</text>
    <path class="edge" d="M182 150 H400"/><text class="branch" x="285" y="138">F</text>
    <path class="edge" d="M400 182 V250 H690"/><text class="branch" x="410" y="239">F</text>
    <text class="out" x="635" y="239">Push 31</text><text class="out" x="520" y="278">False -> 32</text>
  </g>

  <g transform="translate(40 785)">
    <rect class="card" width="750" height="300"/>
    <text x="24" y="38" class="head">V34 - email bat buoc</text>
    <text x="24" y="65" class="expr">typeof email !== 'string' || email.trim() === ''</text>
    <circle class="node" cx="150" cy="150" r="32"/><text class="nodeText" x="150" y="155">34.1</text>
    <circle class="node" cx="400" cy="150" r="32"/><text class="nodeText" x="400" y="155">34.2</text>
    <path class="edge" d="M182 150 H660 V220"/><text class="branch" x="195" y="138">T</text>
    <path class="edge" d="M432 150 H660 V220"/><text class="branch" x="445" y="138">T</text>
    <path class="edge" d="M182 150 H400"/><text class="branch" x="285" y="138">F</text>
    <path class="edge" d="M400 182 V250 H690"/><text class="branch" x="410" y="239">F</text>
    <text class="out" x="635" y="239">Push 35</text><text class="out" x="520" y="278">False -> 36</text>
  </g>

  <g transform="translate(810 785)">
    <rect class="card" width="750" height="300"/>
    <text x="24" y="38" class="head">V38 - dinh dang email</text>
    <text x="24" y="65" class="expr">/\s/.test(email) || !regexEmail.test(email)</text>
    <circle class="node" cx="150" cy="150" r="32"/><text class="nodeText" x="150" y="155">38.1</text>
    <circle class="node" cx="400" cy="150" r="32"/><text class="nodeText" x="400" y="155">38.2</text>
    <path class="edge" d="M182 150 H660 V220"/><text class="branch" x="195" y="138">T</text>
    <path class="edge" d="M432 150 H660 V220"/><text class="branch" x="445" y="138">T</text>
    <path class="edge" d="M182 150 H400"/><text class="branch" x="285" y="138">F</text>
    <path class="edge" d="M400 182 V250 H690"/><text class="branch" x="410" y="239">F</text>
    <text class="out" x="635" y="239">Push 39</text><text class="out" x="520" y="278">False -> 40</text>
  </g>

  <g transform="translate(40 1105)">
    <rect class="card" width="750" height="300"/>
    <text x="24" y="38" class="head">V40 - so dien thoai bat buoc</text>
    <text x="24" y="65" class="expr">typeof phone !== 'string' || phone.trim() === ''</text>
    <circle class="node" cx="150" cy="150" r="32"/><text class="nodeText" x="150" y="155">40.1</text>
    <circle class="node" cx="400" cy="150" r="32"/><text class="nodeText" x="400" y="155">40.2</text>
    <path class="edge" d="M182 150 H660 V220"/><text class="branch" x="195" y="138">T</text>
    <path class="edge" d="M432 150 H660 V220"/><text class="branch" x="445" y="138">T</text>
    <path class="edge" d="M182 150 H400"/><text class="branch" x="285" y="138">F</text>
    <path class="edge" d="M400 182 V250 H690"/><text class="branch" x="410" y="239">F</text>
    <text class="out" x="635" y="239">Push 41</text><text class="out" x="520" y="278">False -> 42</text>
  </g>

  <g transform="translate(810 1105)">
    <rect class="card" width="750" height="300"/>
    <text x="24" y="38" class="head">V44 - website co duoc gui?</text>
    <text x="24" y="65" class="expr">website !== undefined &amp;&amp; website !== ''</text>
    <circle class="node" cx="200" cy="150" r="32"/><text class="nodeText" x="200" y="155">44.1</text>
    <circle class="node" cx="470" cy="150" r="32"/><text class="nodeText" x="470" y="155">44.2</text>
    <path class="edge" d="M232 150 H470"/><text class="branch" x="335" y="138">T</text>
    <path class="edge" d="M200 182 V245 H660"/><text class="branch" x="210" y="220">F</text>
    <path class="edge" d="M470 182 V245 H660"/><text class="branch" x="480" y="220">F</text>
    <path class="edge" d="M502 150 H690"/><text class="branch" x="570" y="138">T</text>
    <text class="out" x="565" y="278">T -> 45; F -> 51</text>
  </g>

  <g transform="translate(40 1425)">
    <rect class="card" width="750" height="300"/>
    <text x="24" y="38" class="head">V45 - website co hop le co ban?</text>
    <text x="24" y="65" class="expr">type !== string || trim() === '' || contains whitespace</text>
    <circle class="node" cx="120" cy="150" r="32"/><text class="nodeText" x="120" y="155">45.1</text>
    <circle class="node" cx="345" cy="150" r="32"/><text class="nodeText" x="345" y="155">45.2</text>
    <circle class="node" cx="560" cy="150" r="32"/><text class="nodeText" x="560" y="155">45.3</text>
    <path class="edge" d="M152 150 H650 V220"/><text class="branch" x="165" y="138">T</text>
    <path class="edge" d="M377 150 H650 V220"/><text class="branch" x="390" y="138">T</text>
    <path class="edge" d="M592 150 H650 V220"/><text class="branch" x="605" y="138">T</text>
    <path class="edge" d="M152 150 H345"/><text class="branch" x="235" y="138">F</text>
    <path class="edge" d="M377 150 H560"/><text class="branch" x="450" y="138">F</text>
    <path class="edge" d="M560 182 V250 H690"/><text class="branch" x="570" y="239">F</text>
    <text class="out" x="610" y="239">Push 46</text><text class="out" x="500" y="278">False -> 47</text>
  </g>

  <g transform="translate(810 1425)">
    <rect class="card" width="750" height="300"/>
    <text x="24" y="38" class="head">V51 - address co duoc gui?</text>
    <text x="24" y="65" class="expr">address !== undefined &amp;&amp; address !== ''</text>
    <circle class="node" cx="200" cy="150" r="32"/><text class="nodeText" x="200" y="155">51.1</text>
    <circle class="node" cx="470" cy="150" r="32"/><text class="nodeText" x="470" y="155">51.2</text>
    <path class="edge" d="M232 150 H470"/><text class="branch" x="335" y="138">T</text>
    <path class="edge" d="M200 182 V245 H660"/><text class="branch" x="210" y="220">F</text>
    <path class="edge" d="M470 182 V245 H660"/><text class="branch" x="480" y="220">F</text>
    <path class="edge" d="M502 150 H690"/><text class="branch" x="570" y="138">T</text>
    <text class="out" x="565" y="278">T -> 52; F -> 56</text>
  </g>

  <g transform="translate(40 1745)">
    <rect class="card" width="750" height="300"/>
    <text x="24" y="38" class="head">V52 - address co hop le co ban?</text>
    <text x="24" y="65" class="expr">typeof address !== 'string' || address.trim() === ''</text>
    <circle class="node" cx="150" cy="150" r="32"/><text class="nodeText" x="150" y="155">52.1</text>
    <circle class="node" cx="400" cy="150" r="32"/><text class="nodeText" x="400" y="155">52.2</text>
    <path class="edge" d="M182 150 H660 V220"/><text class="branch" x="195" y="138">T</text>
    <path class="edge" d="M432 150 H660 V220"/><text class="branch" x="445" y="138">T</text>
    <path class="edge" d="M182 150 H400"/><text class="branch" x="285" y="138">F</text>
    <path class="edge" d="M400 182 V250 H690"/><text class="branch" x="410" y="239">F</text>
    <text class="out" x="635" y="239">Push 53</text><text class="out" x="520" y="278">False -> 54</text>
  </g>

  <g transform="translate(810 1745)">
    <rect class="card" width="750" height="300"/>
    <text x="24" y="38" class="head">V56 - parentUnitId khong hop le?</text>
    <text x="24" y="65" class="expr">defined &amp;&amp; non-null &amp;&amp; (!integer || value &lt;= 0)</text>
    <circle class="node" cx="100" cy="150" r="30"/><text class="nodeText" x="100" y="155">56.1</text>
    <circle class="node" cx="285" cy="150" r="30"/><text class="nodeText" x="285" y="155">56.2</text>
    <circle class="node" cx="470" cy="150" r="30"/><text class="nodeText" x="470" y="155">56.3</text>
    <circle class="node" cx="645" cy="150" r="30"/><text class="nodeText" x="645" y="155">56.4</text>
    <path class="edge" d="M130 150 H285"/><text class="branch" x="195" y="138">T</text>
    <path class="edge" d="M315 150 H470"/><text class="branch" x="380" y="138">T</text>
    <path class="edge" d="M500 150 H645"/><text class="branch" x="555" y="138">F</text>
    <path class="edge" d="M100 180 V225 H520 V250"/><text class="branch" x="108" y="216">F</text>
    <path class="edge" d="M285 180 V225 H520 V250"/><text class="branch" x="293" y="216">F</text>
    <path class="edge" d="M470 180 V225 H690 V250"/><text class="branch" x="478" y="216">T</text>
    <path class="edge" d="M675 180 V225 H690 V250"/><text class="branch" x="683" y="216">T</text>
    <path class="edge" d="M675 180 V250 H520"/><text class="branch" x="630" y="243">F</text>
    <text class="out" x="468" y="278">Continue 58</text><text class="out" x="638" y="278">Push 57</text>
  </g>

  <g transform="translate(40 2065)">
    <rect class="card" width="750" height="300"/>
    <text x="24" y="38" class="head">V60 - URL co phai HTTP/HTTPS va co host?</text>
    <text x="24" y="65" class="expr">(protocol === 'http:' || protocol === 'https:') &amp;&amp; hostname</text>
    <circle class="node" cx="160" cy="150" r="32"/><text class="nodeText" x="160" y="155">60.1</text>
    <circle class="node" cx="390" cy="150" r="32"/><text class="nodeText" x="390" y="155">60.2</text>
    <circle class="node" cx="610" cy="150" r="32"/><text class="nodeText" x="610" y="155">60.3</text>
    <path class="edge" d="M192 150 H610"/><text class="branch" x="390" y="138">T</text>
    <path class="edge" d="M160 182 V232 H390 V182"/><text class="branch" x="170" y="220">F</text>
    <path class="edge" d="M422 150 H610"/><text class="branch" x="505" y="138">T</text>
    <path class="edge" d="M390 182 V250 H700"/><text class="branch" x="400" y="239">F</text>
    <path class="edge" d="M610 182 V250 H700"/><text class="branch" x="620" y="239">T/F</text>
    <text class="out" x="570" y="278">hostname true -> true; false -> false</text>
  </g>

  <g transform="translate(810 2065)">
    <rect class="card" width="750" height="300"/>
    <text x="24" y="38" class="head">Doc so do</text>
    <text x="24" y="82" class="note">T: dieu kien con dung. F: dieu kien con sai.</text>
    <text x="24" y="112" class="note">Voi OR (||): T di den nhanh loi; F moi danh gia dieu kien tiep.</text>
    <text x="24" y="142" class="note">Voi AND (&amp;&amp;): F bo qua phan con lai; T moi danh gia tiep.</text>
    <text x="24" y="172" class="note">Node xanh la dieu kien con duoc tach rieng; nhan goc duoc giu lam tien to.</text>
    <text x="24" y="202" class="note">Cac loi/diem tiep theo duoc ghi theo so trong CFG goc.</text>
  </g>

  <text x="40" y="2410" class="note">Luu y: V45.1-V45.3 va V56.1-V56.4 duoc noi theo thu tu short-circuit cua ma nguon.</text>
  <text x="40" y="2440" class="note">Cac dieu kien don (vi du 20, 22, 26, 28, 32, 36, 42, 47, 49, 54) giu nguyen nhan.</text>
</svg>
